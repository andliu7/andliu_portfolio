# The chat proxy for andliu.dev (SITE-PLAN.md 6.5). The site is static, so the Anthropic key
# lives here as a Worker secret and the browser only ever talks to this Worker.
#
# Deploy, from this folder (worker/), in this order:
#   0. In the Anthropic Console, set a monthly spend limit on the key's workspace FIRST.
#   1. node ../scripts/build-system-prompt.mjs        (regenerate system-prompt.txt from lib/site.ts)
#   2. npx wrangler secret put ANTHROPIC_API_KEY       (paste the key; it is never written to a file)
#   3. npx wrangler deploy
#   4. Build the site with NEXT_PUBLIC_CHAT_URL set to the Worker's URL (empty = offline answers only).
# Before step 3, decide whether to keep http://localhost:3000 in ALLOWED_ORIGINS (worker/handler.js).
# The contact form (POST /contact) also needs RESEND_API_KEY: worker/CONTACT.md.

name = "andliu-chat"
main = "chat.js"
compatibility_date = "2026-05-01"

[vars]
# The cheapest current model, Haiku 5.5 ($0.10 in / $0.50 out per million tokens, claude-api
# skill table cached 2026-10-06; Haiku 4.5 was 10x that). Andrew 2026-11-03. Change it here, not in code.
MODEL = "claude-haiku-5-5"
# The contact form's sender (worker/contact.js). Empty means Resend's shared test sender,
# onboarding@resend.dev; set it to an address on a verified domain later (CONTACT.md).
CONTACT_FROM = ""
# Emails a day across everyone. Reaching it suspends the form until 00:00 UTC (worker/contact.js).
CONTACT_DAILY_CAP = "50"

# The form's daily counter. SQLite-backed, which is the kind the free plan allows.
[[durable_objects.bindings]]
name = "CONTACT_GATE"
class_name = "ContactGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ContactGate"]

# Per-IP rate limit, read as env.CHAT_LIMIT in handler.js: 10 requests per 60 seconds.
[[ratelimits]]
name = "CHAT_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Per-IP rate limit for POST /contact, read as env.CONTACT_LIMIT in contact.js: 3 per 60 seconds.
[[ratelimits]]
name = "CONTACT_LIMIT"
namespace_id = "1002"
simple = { limit = 3, period = 60 }

# Bundle system-prompt.txt as a string module (import SYSTEM_PROMPT from './system-prompt.txt').
[[rules]]
type = "Text"
globs = ["**/*.txt"]
fallthrough = true
